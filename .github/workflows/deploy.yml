name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; never cancel a run that is already deploying.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so Starlight's "last updated" dates are correct

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: npm ci

      - name: Build (includes internal link validation)
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Lint the GEE scripts (ESLint) and Python tooling (ruff)
        run: |
          pip install ruff==0.15.0
          npm run lint

      - name: Colour contrast of theme tokens
        run: npm run check:contrast

      - name: Accessibility scan (axe, WCAG 2 AA) of every page
        run: |
          npx astro preview --port 4321 &
          npx wait-on --timeout 60000 http://localhost:4321/lulc-mapping-training/
          npm run check:a11y -- --sitemap http://localhost:4321/lulc-mapping-training/sitemap-0.xml \
            --sitemap-find "https://wangdiues.github.io" --sitemap-replace "http://localhost:4321"

      - name: Stage the site under its base path for link checking
        run: mkdir -p _site && cp -r dist _site/lulc-mapping-training

      - name: Link check (internal and external)
        uses: lycheeverse/lychee-action@v2
        with:
          # Root-relative links (/lulc-mapping-training/...) resolve against _site, like on GitHub Pages.
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/_site
            --exclude '^https://code\.earthengine\.google\.com'
            --exclude '^https://wangdiues\.github\.io'
            --exclude '^https://github\.com/wangdiues/lulc-mapping-training/edit/'
            --accept '200..=299,403,429'
            '_site/**/*.html'
          fail: true

      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
