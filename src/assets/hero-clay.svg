<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 380" width="440" height="380" role="img" aria-labelledby="t">
	<title id="t">Clay-style illustration: a satellite orbiting above green Himalayan mountains, a forest and a land-cover map grid</title>
	<defs>
		<!-- Clay: a soft drop shadow plus inner highlight (top-left) and inner shade (bottom-right). -->
		<filter id="clay" x="-20%" y="-20%" width="140%" height="150%">
			<feGaussianBlur in="SourceAlpha" stdDeviation="4" result="b" />
			<feOffset in="b" dx="-4" dy="-5" result="hi" />
			<feComposite in="SourceAlpha" in2="hi" operator="out" result="hiEdge" />
			<feFlood flood-color="#000" flood-opacity="0.22" />
			<feComposite in2="hiEdge" operator="in" result="shade" />
			<feOffset in="b" dx="4" dy="5" result="lo" />
			<feComposite in="SourceAlpha" in2="lo" operator="out" result="loEdge" />
			<feFlood flood-color="#fff" flood-opacity="0.55" />
			<feComposite in2="loEdge" operator="in" result="light" />
			<feGaussianBlur in="SourceAlpha" stdDeviation="7" result="db" />
			<feOffset in="db" dy="9" result="drop" />
			<feFlood flood-color="#0c3a23" flood-opacity="0.28" />
			<feComposite in2="drop" operator="in" result="dropC" />
			<feMerge>
				<feMergeNode in="dropC" />
				<feMergeNode in="SourceGraphic" />
				<feMergeNode in="shade" />
				<feMergeNode in="light" />
			</feMerge>
		</filter>
	</defs>

	<!-- Base tile -->
	<rect x="30" y="70" width="380" height="290" rx="48" fill="#d6ede0" filter="url(#clay)" />

	<!-- Sun -->
	<circle cx="330" cy="130" r="30" fill="#f2b13a" filter="url(#clay)" />

	<!-- Orbit and satellite -->
	<path d="M60 120 Q220 -10 400 70" fill="none" stroke="#3c9a66" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" />
	<g filter="url(#clay)" transform="rotate(-18 150 64)">
		<rect x="96" y="54" width="38" height="22" rx="6" fill="#8fb0e0" />
		<rect x="166" y="54" width="38" height="22" rx="6" fill="#8fb0e0" />
		<rect x="132" y="48" width="36" height="34" rx="10" fill="#eef3ef" />
		<circle cx="150" cy="65" r="6" fill="#4a6fa5" />
	</g>

	<!-- Mountains: back to front -->
	<path d="M60 300 Q120 170 170 150 Q205 140 240 200 L290 300 Z" fill="#6fbf8f" filter="url(#clay)" />
	<path d="M160 160 Q170 152 182 150 Q196 152 205 166 Q188 172 176 166 Q168 170 160 160 Z" fill="#ffffff" opacity="0.9" />
	<path d="M200 305 Q260 160 300 175 Q330 185 380 305 Z" fill="#3c9a66" filter="url(#clay)" />
	<path d="M282 182 Q296 170 310 178 Q318 190 306 192 Q296 186 282 182 Z" fill="#ffffff" opacity="0.85" />

	<!-- Forest: rounded clay trees -->
	<g filter="url(#clay)">
		<path d="M95 290 Q110 230 125 290 Z" fill="#1a6a42" />
		<path d="M125 296 Q142 222 160 296 Z" fill="#24804f" />
		<path d="M158 292 Q172 240 186 292 Z" fill="#1a6a42" />
		<path d="M300 296 Q315 238 330 296 Z" fill="#24804f" />
		<path d="M326 292 Q340 246 354 292 Z" fill="#1a6a42" />
	</g>

	<!-- Land-cover map grid in the foreground -->
	<g filter="url(#clay)">
		<rect x="70" y="300" width="300" height="42" rx="16" fill="#eef3ef" />
	</g>
	<g>
		<rect x="84" y="309" width="44" height="24" rx="7" fill="#3c9a66" />
		<rect x="134" y="309" width="44" height="24" rx="7" fill="#6fbf8f" />
		<rect x="184" y="309" width="44" height="24" rx="7" fill="#e3a945" />
		<rect x="234" y="309" width="44" height="24" rx="7" fill="#8fb0e0" />
		<rect x="284" y="309" width="44" height="24" rx="7" fill="#1a6a42" />
		<rect x="334" y="309" width="24" height="24" rx="7" fill="#c3ccc6" />
	</g>
</svg>
